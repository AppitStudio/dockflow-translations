name: Check translation changes
on: pull_request
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the proposed text using the base branch checker
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE:tools/check_translations.py" > "$RUNNER_TEMP/check_translations.py"
          python3 -I "$RUNNER_TEMP/check_translations.py" "$BASE" HEAD
